name: Update Fresh Morphe Data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: fresh-morphe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The full crawl + parse + diff cycle needs headroom: a 2026-10-26 run
    # took 14m22s, so the old 15m cap cancelled every scheduled run after it.
    # 2026-10-29 then hit the 30m cap inside icon fetching (404 retries), now
    # bounded by ICON_FETCH_LIMIT + permanent-404 handling.
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.FRESH_DEPLOY_KEY || secrets.MORPHE_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover New Sources
        # Runs independently of the pipeline so a slow GitHub search can never
        # block the hourly data update. Failures are non-fatal.
        continue-on-error: true
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCOVERY_SEARCH_PAGES: '3'
        run: python scripts/discover_sources.py

      - name: Run Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_TYPE: ${{ github.event_name }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ICON_FETCH_LIMIT: '40'
        run: |
          python scripts/run_pipeline.py

      - name: Verify Data Files
        run: |
          echo "Checking essential data files..."
          for f in data/core.json data/stats.json data/changes.json data/changelog.json data/bundles/_index.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            echo "  $f: ${size} bytes"
          done
          echo "All essential files present."

      - name: Commit and Push State Changes to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/msg.txt
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "chore(data): auto-update Fresh Morphe patch tracking state [skip ci]"
            git push origin main
          else
            echo "No changes detected. Skipping commit to main."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: node scripts/build.js

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
